name: Application VTLO_REcod3r

on:
  workflow_dispatch:
  push:
    paths: ["app/**"]
  pull_request:
    paths: ["app/**"]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.py }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        py: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - run: python app/tests/test_app.py

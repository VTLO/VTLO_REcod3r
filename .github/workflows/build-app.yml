name: Application VTLO_REcod3r

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  binaire:
    name: Binaire autonome (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p recod3r-app
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: recod3r-${{ matrix.os }}
          path: |
            app/target/release/recod3r
            app/target/release/recod3r.exe

  application:
    name: Application fenêtrée (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Dépendances Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Icônes
        run: npx --yes @tauri-apps/cli@2 icon icon-source.png
        working-directory: app/src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "VTLO_REcod3r ${{ github.ref_name }}"
          releaseDraft: true

[package]
name = "recod3r-tauri"
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["VTLO"]
description = "VTLO_REcod3r — coque Tauri 2 (Linux, Windows, macOS, Android, iOS)"

[lib]
name = "recod3r_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
recod3r-core = { path = "../core" }
serde_json = "1"
